[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zfm"
version = "0.1.0"
description = "Audio file manipulation and playlist management tool"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click==7.1.1",
    "py==1.10.0",
    "pytest==3.2.3",
    "pydub==0.25.1",
    "pytimeparse==1.1.8",
    "audioop-lts>=0.2.1; python_version>='3.13'",
]

[project.scripts]
zfm = "zfm:zfm"

